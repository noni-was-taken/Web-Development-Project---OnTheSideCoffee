<!DOCTYPE html>

<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

        <title>
            OnTheSide Cafe &lt3
        </title>
        <link rel="stylesheet" href="/css/index.css">
    </head>
    <body>
        <div class="cafeBackground">
            <img src="/images/cafeBackground.jpg" alt="background">
        </div>
    <div class="welcome-layer">
        <div class="sideViewLeft">
            <div class="logoDisplay">
                <img src="/images/cafeLogo.png" alt="logo">
            </div>
            <div class="navigationTab">
                <nav>
                    <a href="#">Home</a>
                    <a>Gallery</a>
                    <a>Menu</a>
                    <a>About Us</a>
                    <a>Merch</a>
                </nav>
            </div>
            <div class="contrastButton">
                <a>START SIPPING!</a>
            </div>
            <div class="contacts">
                <p>
                    P. del Rosario St., Cebu City, 6000, Philippines
                    <br><br>
                    Phone: <a href="#">123-4567-89</a> <br>
                    Email: <a href="#"> ontheside@coffee.ph</a>
                </p>
            </div>
        </div>
        <div class="sideViewRight">
            <div class="Entrance">
                <h1 class="normalText">For all your </h1> <h1 class="specialText"> CAFFEINE </h1> <h1 class="normalText"> needs.</h1>
                <small>ON THE SIDE</small>
            </div>
            <div class="scrollHereText">
               <p>
                SCROLL TO CONTINUE
               </p>
               <h1>
                >
               </h1>
            </div>
        </div>
    </div>
    <div class="layer-1">
        <p>
           > input body here < 
        </p>
    </div>

    <script>
        window.addEventListener('scroll', function(){
            const header = document.querySelector('.sideViewLeft');
            const scrollTriggerPx = window.innerHeight;

            if(window.scrollY > scrollTriggerPx){
                header.classList.add('movedUp');
            } else {
                header.classList.remove('movedUp');
            }
        });
    </script>
    </body>
</html>
